global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Métricas internas del OTel Collector + métricas de apps reenviadas por él.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888', 'otel-collector:8889']

  # Ejemplo: scrapear el /metrics de una app que corre en el HOST (descomentar y ajustar).
  # - job_name: <proyecto>
  #   static_configs:
  #     - targets: ['host.docker.internal:9091']
