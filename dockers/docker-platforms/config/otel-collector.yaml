receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true          # red interna core_net
  prometheus:
    endpoint: 0.0.0.0:8889    # Prometheus lo scrapea (job otel-collector)

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888   # métricas internas del collector
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
